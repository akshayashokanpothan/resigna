<!--
  Supabase "Magic link" email template.
  Paste into Dashboard → Authentication → Emails → Magic link (subject: "Your Resigna sign-in link").
  {{ .RedirectTo }} is the app's /api/auth/confirm?next=... URL, so the link lands on the same
  host (BA or GA) the user signed in from and works on any device.
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #161616;">
  <h2 style="margin: 0 0 16px; font-size: 20px;">Sign in to Resigna</h2>
  <p style="margin: 0 0 24px; font-size: 14px; line-height: 20px;">
    Click the button to sign in. The link works once and expires in 1 hour.
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
       style="display: inline-block; background: #6e5cf6; color: #ffffff; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-size: 14px; font-weight: 600;">
      Sign in to Resigna
    </a>
  </p>
  <p style="margin: 0 0 8px; font-size: 14px; line-height: 20px;">Or enter this code on the sign-in page:</p>
  <p style="margin: 0 0 24px; font-size: 28px; font-weight: 700; letter-spacing: 6px;">{{ .Token }}</p>
  <p style="margin: 0; font-size: 12px; line-height: 18px; color: #6f6f6f;">
    If you didn't ask to sign in, you can ignore this email.
  </p>
</div>
